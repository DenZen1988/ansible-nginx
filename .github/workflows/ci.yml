---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly on Sundays to catch upstream breakage
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: pip install yamllint ansible-lint
      - name: Run yamllint
        run: yamllint .
      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: "Molecule (${{ matrix.scenario }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - source
          - ssl
          - reverse_proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible-role-nginx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            molecule \
            molecule-plugins[docker] \
            ansible \
            docker

      - name: Install Ansible Galaxy dependencies
        run: |
          ansible-galaxy collection install community.crypto community.general

      - name: Run Molecule — ${{ matrix.scenario }}
        run: molecule test --scenario-name ${{ matrix.scenario }}
        working-directory: ansible-role-nginx
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ubuntu2204

  # Summary gate for branch protection
  ci-pass:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [lint, molecule]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.molecule.result }}" != "success" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed!"
