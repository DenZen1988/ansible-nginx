---
name: CI

on:
  push:
    branches: [main, master, default]
  pull_request:
    branches: [main, master, default]
  schedule:
    # Weekly on Sundays to catch upstream breakage
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up venv and install lint dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install yamllint ansible-lint
      - name: Run yamllint
        run: |
          source .venv/bin/activate
          yamllint .
      - name: Run ansible-lint
        run: |
          source .venv/bin/activate
          ansible-lint
      - name: Run jinja2-lint
        run: |
          source .venv/bin/activate
          pip install djlint
          djlint templates/*.j2 --profile=jinja
      - name: Run markdownlint
        run: |
          source .venv/bin/activate
          pip install markdownlint-cli
          markdownlint README.md CHANGELOG.md

  molecule:
    name: "Molecule (${{ matrix.scenario }})"
    runs-on: [self-hosted, linux, x64]
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - source
          - ssl
          - reverse_proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible-nginx

      - name: Set up venv and install dependencies
        run: |
          python3 -m venv ${{ github.workspace }}/.venv
          source ${{ github.workspace }}/.venv/bin/activate
          pip install --upgrade pip
          pip install \
            molecule \
            molecule-plugins[docker] \
            ansible \
            docker

      - name: Install Ansible Galaxy dependencies
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          ansible-galaxy collection install community.crypto community.general

      - name: Run Molecule — ${{ matrix.scenario }}
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          molecule test --scenario-name ${{ matrix.scenario }}
        working-directory: ansible-nginx
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: debian13

  # Summary gate for branch protection
  ci-pass:
    name: CI Passed
    runs-on: [self-hosted, linux, x64]
    needs: [lint, molecule]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.molecule.result }}" != "success" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed!"
