---
- name: (Source) Install build dependencies
  ansible.builtin.apt:
    name: "{{ nginx_source_dependencies }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: (Source) Create Build Directory
  ansible.builtin.file:
    path: "/usr/local/src/nginx"
    state: directory
    mode: "0755"

- name: (Source) Download Nginx Source Code
  ansible.builtin.get_url:
    url: "https://nginx.org/download/nginx-{{ nginx_source_version }}.tar.gz"
    dest: "/usr/local/src/nginx/nginx-{{ nginx_source_version }}.tar.gz"
    mode: "0644"
  register: _nginx_source_download

- name: (Source) Extract Nginx Source Code
  ansible.builtin.unarchive:
    src: "/usr/local/src/nginx/nginx-{{ nginx_source_version }}.tar.gz"
    dest: "/usr/local/src/nginx/"
    remote_src: true
  when: _nginx_source_download.changed  # no-qa: no-handler

- name: (Source) Configure Nginx Build
  ansible.builtin.command:
    cmd: "./configure {{ nginx_source_configure_flags | join(' ') }}"
    chdir: "/usr/local/src/nginx/nginx-{{ nginx_source_version }}"
    creates: "/usr/local/src/nginx/nginx-{{ nginx_source_version }}/Makefile"

- name: (Source) Compile Nginx
  community.general.make:
    chdir: "/usr/local/src/nginx/nginx-{{ nginx_source_version }}"
  register: _nginx_make

- name: (Source) Install Nginx
  community.general.make:
    chdir: "/usr/local/src/nginx/nginx-{{ nginx_source_version }}"
    target: install
  when: _nginx_make.changed  # no-qa: no-handler

- name: (source) Create systemd service file for Nginx
  ansible.builtin.template:
    src: "nginx.service.j2"
    dest: "/etc/systemd/system/nginx.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Nginx

- name: (Source) Create Nginx User
  ansible.builtin.user:
    name: "{{ nginx_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: (Source) Ensure Nginx Log Directory Exists
  ansible.builtin.file:
    path: "{{ nginx_log_dir }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: adm
    mode: "0755"
