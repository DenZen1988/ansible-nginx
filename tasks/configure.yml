---
- name: Ensure configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nginx_conf_dir }}"
    - "{{ nginx_conf_dir }}/conf.d"
    - "{{ nginx_sites_available_dir }}"
    - "{{ nginx_sites_enabled_dir }}"
    - "{{ nginx_conf_dir }}/snippets"

- name: Remove default vhost files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ nginx_sites_enabled_dir }}/default"
    - "{{ nginx_sites_available_dir }}/default"
    - "{{ nginx_conf_dir }}/conf.d/default.conf"
  when: nginx_remove_default_vhost | bool

- name: Deploy main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy proxy params snippet
  ansible.builtin.template:
    src: proxy_params.conf.j2
    dest: "{{ nginx_conf_dir }}/snippets/proxy_params.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy SSL params snippet
  ansible.builtin.template:
    src: ssl_params.conf.j2
    dest: "{{ nginx_conf_dir }}/snippets/ssl_params.conf"
    owner: root
    group: root
    mode: "0644"
  when: nginx_ssl_enabled | bool
  notify: Reload nginx

- name: Deploy stub status config
  ansible.builtin.template:
    src: stub_status.conf.j2
    dest: "{{ nginx_sites_available_dir }}/stub_status.conf"
    owner: root
    group: root
    mode: "0644"
  when: nginx_stub_status_enabled | bool
  notify: Reload nginx

- name: Enable stub status config
  ansible.builtin.file:
    src: "{{ nginx_sites_available_dir }}/stub_status.conf"
    dest: "{{ nginx_sites_enabled_dir }}/stub_status.conf"
    state: link
  when: nginx_stub_status_enabled | bool
  notify: Reload nginx

- name: Remove stub status config when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ nginx_sites_enabled_dir }}/stub_status.conf"
    - "{{ nginx_sites_available_dir }}/stub_status.conf"
    - "{{ nginx_conf_dir }}/conf.d/stub_status.conf"
  when: not (nginx_stub_status_enabled | bool)
  notify: Reload nginx
