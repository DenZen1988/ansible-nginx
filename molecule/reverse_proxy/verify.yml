---
- name: Verify — reverse proxy and load balancing
  hosts: all
  become: true
  tasks:
    # ── Config valid ──
    - name: Validate nginx config
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      failed_when: _nginx_t.rc != 0
      register: _nginx_t

    # ── Upstream configs deployed ──
    - name: Check app_backend upstream config
      ansible.builtin.stat:
        path: /etc/nginx/conf.d/upstream_app_backend.conf
      register: _upstream_app

    - name: Check ws_backend upstream config
      ansible.builtin.stat:
        path: /etc/nginx/conf.d/upstream_ws_backend.conf
      register: _upstream_ws

    - name: Assert upstream configs exist
      ansible.builtin.assert:
        that:
          - _upstream_app.stat.exists
          - _upstream_ws.stat.exists
        fail_msg: "Upstream config files missing"

    # ── Upstream content ──
    - name: Read app_backend upstream config
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/upstream_app_backend.conf
      register: _upstream_app_content

    - name: Assert upstream has expected config
      ansible.builtin.assert:
        that:
          - "'least_conn' in (_upstream_app_content.content | b64decode)"
          - "'keepalive 16' in (_upstream_app_content.content | b64decode)"
          - "'127.0.0.1:8081 weight=3' in (_upstream_app_content.content | b64decode)"
          - "'127.0.0.1:8082' in (_upstream_app_content.content | b64decode)"
        fail_msg: "Upstream config content incorrect"

    - name: Read ws_backend upstream config
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/upstream_ws_backend.conf
      register: _upstream_ws_content

    - name: Assert websocket upstream uses ip_hash
      ansible.builtin.assert:
        that: "'ip_hash' in (_upstream_ws_content.content | b64decode)"
        fail_msg: "WebSocket upstream should use ip_hash"

    # ── Proxy params snippet ──
    - name: Read proxy params snippet
      ansible.builtin.slurp:
        src: /etc/nginx/snippets/proxy_params.conf
      register: _proxy_params

    - name: Assert proxy params have custom timeouts
      ansible.builtin.assert:
        that:
          - "'proxy_connect_timeout 30' in (_proxy_params.content | b64decode)"
          - "'proxy_send_timeout 120' in (_proxy_params.content | b64decode)"
          - "'proxy_read_timeout 120' in (_proxy_params.content | b64decode)"
          - "'proxy_buffer_size 8k' in (_proxy_params.content | b64decode)"
        fail_msg: "Proxy params missing custom timeouts"

    # ── Vhost content ──
    - name: Read proxy vhost
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/proxy.test.local.conf
      register: _proxy_conf

    - name: Decode proxy vhost
      ansible.builtin.set_fact:
        proxy_conf: "{{ _proxy_conf.content | b64decode }}"

    - name: Assert vhost has rate limiting
      ansible.builtin.assert:
        that: "'limit_req zone=test_limit burst=20 nodelay' in proxy_conf"
        fail_msg: "Rate limiting not configured in vhost"

    - name: Assert vhost has proxy_pass to upstream
      ansible.builtin.assert:
        that: "'proxy_pass http://app_backend' in proxy_conf"
        fail_msg: "proxy_pass to upstream missing"

    - name: Assert vhost has WebSocket headers
      ansible.builtin.assert:
        that:
          - "'proxy_http_version 1.1' in proxy_conf"
          - "'Upgrade $http_upgrade' in proxy_conf"
          - "'$connection_upgrade' in proxy_conf"
        fail_msg: "WebSocket headers missing in vhost"

    # ── Rate limit zone in nginx.conf ──
    - name: Read nginx.conf
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: _nginx_conf

    - name: Assert rate limit zone configured
      ansible.builtin.assert:
        that: "'limit_req_zone' in (_nginx_conf.content | b64decode)"
        fail_msg: "Rate limit zone missing from nginx.conf"

    # ── WebSocket upgrade map in nginx.conf ──
    - name: Assert websocket upgrade map present
      ansible.builtin.assert:
        that: "'map $http_upgrade $connection_upgrade' in (_nginx_conf.content | b64decode)"
        fail_msg: "WebSocket upgrade map missing from nginx.conf"

    # ── Proxy actually works ──
    - name: Test proxy passes to backend
      ansible.builtin.uri:
        url: "http://localhost/"
        return_content: true
      register: _proxy_response

    - name: Assert response comes from backend
      ansible.builtin.assert:
        that:
          - _proxy_response.status == 200
          - "'server' in _proxy_response.content"
        fail_msg: "Proxy not forwarding to backend correctly"

    # ── Rate-limited endpoint accessible ──
    - name: Test rate-limited API endpoint
      ansible.builtin.uri:
        url: "http://localhost/api/"
        status_code: [200, 404]
        return_content: true
      register: _api_response

    - name: Assert API endpoint is proxied
      ansible.builtin.assert:
        that: _api_response.status in [200, 404]
        fail_msg: "API endpoint not accessible through proxy"

    # ── Service running ──
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service'].state == 'running'"
        fail_msg: "nginx service not running"
