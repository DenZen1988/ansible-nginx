---
- name: Converge - package install with basic vhost
  hosts: all
  become: true
  vars:
    nginx_install_method: "package"
    nginx_official_repo_enabled_enabled: false  # Use distro packages for testing
    nginx_remove_default_vhost: true
    nginx_worker_processes: "auto"
    nginx_worker_connections: 1024
    nginx_client_max_body_size: "32m"
    nginx_server_tokens: "off"
    nginx_stub_status_enabled: true
    nginx_stub_status_allowed_ips:
      - "127.0.0.1"
    nginx_og_formats:
      custom: '$remote_addr - $remote_user [$time_local] "$request" $status'

    nginx_extra_http_directives:
      - "map $http_x_forwarded_proto $real_scheme { default $scheme; https https}"
    nginx_vhosts:
      - name: "testsite.local"
        listen: "80"
        server_name: "testsite.local"
        root: "/var/www/testsite.local/html"
        index: "index.html"
        enabled: true
        extra_directives:
          - "access_log /var/log/nginx/testsite.access.log"
        locations:
          - match: "/"
            directives:
              - "try_files $uri $uri/ =404"
          - match: "-* \\.(jpg|jpeg|png|gif|ico|css|js)$"
            directives:
              - "expires 7d"
              - "add_header Cache-Control 'public, no-transform'"
      - name: disabled-site.local
        listen: "80"
        server_name: "disabled-site.local"
        root: "/var/www/disabled-site.local/html"
        index: "index.html"
        enabled: false
        locations: []
  pre_tasks:
    - name: Create test index.html
      ansible.builtin.file:
        path: "/var/www/testsite.local/html"
        state: directory
        mode: "0755"
    - name: Create test index.html
      ansible.builtin.copy:
        dest: "/var/www/testsite.local/html/index.html"
        content: "<html><body><h1>Test Site</h1></body></html>"
        mode: "0644"
  roles:
    - role: ansible-nginx
